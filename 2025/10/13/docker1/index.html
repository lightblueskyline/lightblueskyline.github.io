pan> <span class="comment"># 賬戶名稱</span></span><br><span class="line">      <span class="attr">MYSQL_PASSWORD:</span>  <span class="comment"># dbuser 賬戶密碼</span></span><br><span class="line">    <span class="attr">volumes:</span></span><br><span class="line">      <span class="bullet">-</span> <span class="string">/home/light/mysql_data:/var/lib/mysql</span></span><br><span class="line">    <span class="attr">ports:</span></span><br><span class="line">      <span class="bullet">-</span> <span class="string">&quot;53306:3306&quot;</span> <span class="comment"># 主機端口:容器端口</span></span><br><span class="line"></span><br><span class="line">  <span class="attr">phpmyadmin:</span></span><br><span class="line">    <span class="attr">container_name:</span> <span class="string">phpmyadmin_container</span> <span class="comment"># 容器名稱</span></span><br><span class="line">    <span class="attr">image:</span> <span class="string">phpmyadmin:latest</span> <span class="comment"># 鏡像版本</span></span><br><span class="line">    <span class="attr">restart:</span> <span class="string">always</span> <span class="comment"># 自動重啓</span></span><br><span class="line">    <span class="attr">environment:</span></span><br><span class="line">      <span class="attr">PMA_ARBITRARY:</span> <span class="number">1</span></span><br><span class="line">      <span class="attr">PMA_HOST:</span> <span class="string">mysql</span></span><br><span class="line">      <span class="attr">PMA_PORT:</span> <span class="number">3306</span></span><br><span class="line">      <span class="attr">MYSQL_ROOT_PASSWORD:</span>  <span class="comment"># MySQL root 賬戶密碼</span></span><br><span class="line">    <span class="attr">depends_on:</span></span><br><span class="line">      <span class="bullet">-</span> <span class="string">mysql</span> <span class="comment"># 確保 phpMyAdmin 在 MySQL 容器之後啓動</span></span><br><span class="line">    <span class="attr">ports:</span></span><br><span class="line">      <span class="bullet">-
